[project]
name = "tendril"
version = "0.1.0"
description = "Deterministic diagram synthesis engine from technical specifications"
authors = ["Sri Ram Sharma 193415805+sriramxdev@users.noreply.github.com"]
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-arm64"]
license = "AGPL-3.0-or-later"
readme = "README.md"

[dependencies]
python = "3.12.*"
# Native runtime dependencies (no system package manager required)
nodejs = ">=20.0.0"
tree-sitter = ">=0.21.0"
git = "*"

# Backend & Web
fastapi = ">=0.110.0"
uvicorn = ">=0.28.0"
pydantic = ">=2.6.0"
pydantic-settings = ">=2.2.0"
structlog = ">=24.1.0"
httpx = ">=0.27.0"

# Storage & Math
pymongo = ">=4.6.0"
motor = ">=3.3.0"
numpy = ">=1.26.0"
openai = ">=1.14.0"

[pypi-dependencies]
# Dependencies not readily packaged on conda-forge or requiring PyPI bleeding-edge
tree-sitter-languages = "*"

[feature.dev.dependencies]
pytest = ">=8.1.0"
pytest-asyncio = ">=0.23.0"
mypy = ">=1.9.0"
ruff = ">=0.3.0"

[feature.prod]
# Strips test runners and dev tools for container deployments

[environments]
default = { features = ["dev"] }
prod = { features = [], solve-group = "prod" }

[tasks]
# Developer workflow tasks
dev = "uvicorn server.main:app --reload --host 0.0.0.0 --port 8000"
lint = "ruff check . && ruff format --check ."
format = "ruff format . && ruff check --fix ."
typecheck = "mypy --strict core/ compiler/ db/ extraction/ server/"
test = "pytest tests/ -v"
eval = "python benches/run_benchmarks.py"